      {id:'bio-glycolysis',title:'糖酵解与糖异生',tier:'高频',goals:['画出糖酵解主线','找出不可逆步骤及关键酶','解释糖异生如何绕过不可逆步骤'],questions:['糖酵解的三个不可逆步骤是什么？','糖异生为什么不能简单逆转糖酵解？','饥饿时肝脏为什么增强糖异生？'],mechanism:'反应路径 → 关键酶 → 能量收支 → 激素调节。先理解方向，再背酶名。',skip:'第一遍可暂缓少见中间产物的精确结构式。',points:[{id:'glycolysis',title:'糖酵解主线',detail:'从葡萄糖到丙酮酸的关键节点',recall:'不用看书，写出三个不可逆步骤的酶。'},{id:'gluconeogenesis',title:'糖异生绕行',detail:'绕过糖酵解不可逆反应',recall:'糖异生如何绕过丙酮酸激酶这一步？'},{id:'regulation',title:'代谢方向调节',detail:'能量状态和激素调节',recall:'胰高血糖素升高时两条路径如何变化？'}],confusions:['糖酵解与糖异生的方向调节','底物水平磷酸化与氧化磷酸化'],memorize:['糖酵解三个关键酶','糖异生对应的绕行酶']},

    else if (d.course) {state.course=d.course;save();render();}
    else if (d.openChapter) {state.lesson[state.course]=d.openChapter;state.view='class';save();render();window.scrollTo(0,0);}
    else if (d.mark) {const m=state.marks[d.mark]||{};const next=m.status===d.status?'':d.status;state.marks[d.mark]={...m,status:next,updated:Date.now(),due:shiftedDay(next==='good'?3:next==='fuzzy'?1:0)};save();render();}
    else if (d.emphasis) {const m=state.marks[d.emphasis]||{};state.marks[d.emphasis]={...m,emphasis:!m.emphasis,updated:Date.now()};save();render();}
    else if (d.review) openReview(d.review,d.fromDaily==='true');
    else if (d.assess) assess(d.assess);
    else if ('close' in d) {pendingImport=null;closeModal();}
    else if (b.id==='settingsBtn'||b.id==='backToSettings') {pendingImport=null;settings();}
    else if (b.id==='dropoutBtn') openDropout();
    else if (b.id==='resumeDropout') {if(state.dropout?.finished)returnToClass();else openDropout();}
    else if (d.reason) {state.dropout={course:state.course,lessonId:lesson().id,reason:d.reason,remaining:900,endsAt:null,finished:false};save();render();renderDropoutTask();}
    else if (b.id==='timerToggle') toggleTimer();
    else if (b.id==='finishFallback') returnToClass();
    else if (b.id==='downloadTemplate') {const template=clone(STARTER);COURSE_IDS.forEach(id=>template[id].chapters.forEach(ch=>ch.points.forEach(p=>p.answer='')));download('classpilot-course-template.json',template);}
    else if (b.id==='exportData') download(`classpilot-backup-${today()}.json`,{...state,format:'classpilot-backup',exportedAt:new Date().toISOString()});
    else if (b.id==='confirmImport') confirmImport();
    else if (b.id==='resetData') showModal('清空学习记录？','<p>这会清空所有标记、随记、回答、任务记录和考试日期，并恢复示例课程。可以先导出备份。</p><div class="stack"><button class="button ghost" id="exportData">先导出备份</button><button class="button alert" id="confirmReset">确认清空</button><button class="button secondary" data-close>取消</button></div>');
    else if (b.id==='confirmReset') {clearInterval(timer);timer=null;state=newState();canPersist=true;storageMessage='';save();closeModal();render();showToast('已恢复示例课程。');}
  });
  document.addEventListener('change', async event => {
    const t=event.target,d=t.dataset;
    if (t.id==='lessonSelect') {state.lesson[state.course]=t.value;save();render();}
    else if (t.id==='progressChapter') {state.progress[state.course]=Math.max(1,Math.min(learningChapters().length,Number(t.value)||1));state.progressEstimated[state.course]=false;state.lesson[state.course]=progressLesson().id;save();render();}
    else if (t.id==='weeklyReviewDay') {state.reviewDays[state.course]=Math.max(0,Math.min(6,Number(t.value)||0));save();render();}
    else if (d.examdate) {state.examDates[d.examdate]=dateValid(t.value)?t.value:'';save();render();}
    else if (t.id==='dailyBudget') {state.budgets[dailyKey()]=Math.max(10,Math.min(120,Number(t.value)||30));save();render();}
    else if (t.id==='yesterdayOverride') {if(t.value==='auto')delete state.yesterdayOverrides[dailyKey()];else state.yesterdayOverrides[dailyKey()]=t.value;save();render();}
    else if (d.daily) {state.dailyDone[dailyKey()]??={};state.dailyDone[dailyKey()][d.daily]=t.checked;save();render();}
    else if ('weekCheck' in d) {state.weeklyChecks[weeklyKey()]??={};state.weeklyChecks[weeklyKey()][d.weekCheck]=t.checked;save();render();}
    else if ((t.id==='courseImport'||t.id==='backupImport') && t.files?.[0]) await prepareImport(t.files[0],t.id==='backupImport');
  });
  document.addEventListener('input', event => {const t=event.target;if(t.dataset.note){state.notes[t.dataset.note]=t.value;save();}else if(t.dataset.answer){state.answers[t.dataset.answer]=t.value;save();}});
  document.addEventListener('keydown', event => {
    const modal=document.querySelector('.modal');if(!modal)return;
    if(event.key==='Escape'){pendingImport=null;closeModal();return;}
    if(event.key==='Tab') {const nodes=[...modal.querySelectorAll('button:not(:disabled),input,textarea,select,summary,[tabindex="0"]')];const first=nodes[0],last=nodes[nodes.length-1];if(event.shiftKey && (document.activeElement===first||document.activeElement===modal)){event.preventDefault();last?.focus();}else if(!event.shiftKey && document.activeElement===last){event.preventDefault();first?.focus();}}
  });
  let renderedDate=today();
  document.addEventListener('visibilitychange',()=>{if(document.hidden)return;syncTimer();if(renderedDate!==today()){renderedDate=today();render();}});
  render();resumeTimer();

})();
</script>
</body>
</html>
